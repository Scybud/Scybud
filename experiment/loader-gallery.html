<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loader Gallery | Scybud</title>

  <!-- Scybud UI Core -->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/global-buttons.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-primary);
      padding: var(--space-xl) var(--space-lg);
      box-sizing: border-box;
    }

    .top-bar {
      max-width: 1200px;
      margin: 0 auto var(--space-xl);
    }

    h1 {
      text-align: center;
      margin: 0 0 var(--space-sm);
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
      font-size: var(--text-md);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-lg);
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface-primary);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      border: 1px solid var(--border-primary);
      box-shadow: var(--shadow);
      transition: transform var(--transition-normal);
      min-height: 220px;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
    }

    .label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      font-weight: var(--font-medium);
    }

    .actions {
      display: flex;
      gap: var(--space-sm);
      width: 100%;
    }

    .actions .btn {
      flex: 1;
      font-size: var(--text-xs);
      padding: var(--space-xs) var(--space-sm);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-primary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-weight: var(--font-bold);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      border: 1px solid var(--border-primary);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ========== LOADER STYLES ========== */

    /* 1. Rising Bars */
    .rising-bars {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 80px;
      overflow: hidden;
    }
    .rising-bars span {
      transform-origin: left top;
      animation: moveUp 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      width: 50px;
      height: 10px;
      background: linear-gradient(145deg, var(--primary), var(--primary-light));
      border-radius: 2px;
    }
    .rising-bars span:nth-child(even) { width: 40px; opacity: 0.8; }
    .rising-bars span:nth-child(10) { animation-delay: 0.05s; }
    .rising-bars span:nth-child(9)  { animation-delay: 0.1s; }
    .rising-bars span:nth-child(8)  { animation-delay: 0.15s; }
    .rising-bars span:nth-child(7)  { animation-delay: 0.2s; }
    .rising-bars span:nth-child(6)  { animation-delay: 0.25s; }
    .rising-bars span:nth-child(5)  { animation-delay: 0.3s; }
    .rising-bars span:nth-child(4)  { animation-delay: 0.35s; }
    .rising-bars span:nth-child(3)  { animation-delay: 0.4s; }
    .rising-bars span:nth-child(2)  { animation-delay: 0.45s; }
    .rising-bars span:nth-child(1)  { animation-delay: 0.5s; }
    @keyframes moveUp {
      from { transform: translateY(40px) scale(0.4); opacity: 1; }
      to   { transform: translateY(-60px) scale(1); opacity: 0; }
    }

    /* 2. Pulse */
    .tt-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--primary);
      animation: tt-pulse 1.2s infinite ease-in-out;
    }
    @keyframes tt-pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 3. Spinner */
    .tt-spinner {
      width: 42px; height: 42px;
      border: 4px solid var(--border-secondary);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: tt-spin 0.8s linear infinite;
    }
    @keyframes tt-spin { to { transform: rotate(360deg); } }

    /* 4. Bite */
    .tt-bite {
      width: 48px; height: 48px;
      background: var(--primary);
      border-radius: 50%;
      position: relative;
      animation: tt-bite-anim 1.2s infinite ease-in-out;
    }
    .tt-bite::after {
      content: "";
      position: absolute;
      right: -6px; top: 6px;
      width: 22px; height: 22px;
      background: var(--bg-primary);
      border-radius: 50%;
    }
    @keyframes tt-bite-anim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.85); }
    }

    /* 5. Ingredient Shuffle */
    .tt-ingredients { display: flex; gap: 8px; }
    .tt-ingredients span {
      width: 12px; height: 12px;
      background: var(--primary);
      border-radius: 50%;
      animation: tt-move 1.2s infinite ease-in-out;
    }
    .tt-ingredients span:nth-child(2) { animation-delay: 0.15s; }
    .tt-ingredients span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes tt-move {
      0%, 80%, 100% { transform: translateY(0); opacity: 1; }
      40% { transform: translateY(-10px); opacity: 0.7; }
    }
    .tt-logo {
      font-size: 1.4rem; font-weight: 700;
      color: var(--primary);
      animation: tt-pop 1.2s infinite ease-in-out;
    }
    @keyframes tt-pop {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    /* 6. Waveform */
    .tt-wave-loader {
      display: flex; align-items: flex-end; gap: 6px; height: 32px;
    }
    .tt-wave-loader span {
      width: 6px; height: 100%;
      background: var(--primary);
      border-radius: 6px;
      animation: tt-wave 1.2s ease-in-out infinite;
    }
    .tt-wave-loader span:nth-child(2) { animation-delay: 0.15s; }
    .tt-wave-loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes tt-wave {
      0%, 80%, 100% { height: 20%; opacity: 0.6; }
      40% { height: 100%; opacity: 1; }
    }

    /* 7. Sauce Swirl */
    .tt-sauce-loader { width: 60px; height: 60px; }
    .tt-sauce {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--primary) 0deg, var(--primary) 90deg, transparent 90deg);
      animation: tt-sauce-spin 1.4s ease-in-out infinite;
      mask: radial-gradient(circle at center, transparent 40%, black 41%);
    }
    @keyframes tt-sauce-spin {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0.7; }
      50% { transform: rotate(180deg) scale(1); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.7; }
    }

    /* 8. Cloche */
    .tt-cloche-loader { position: relative; width: 70px; height: 70px; }
    .tt-plate {
      width: 70px; height: 70px; border-radius: 50%;
      background: var(--text-primary);
      border: 3px solid var(--primary);
    }
    .tt-lid {
      position: absolute; width: 70px; height: 35px;
      background: var(--primary);
      border-radius: 70px 70px 0 0;
      top: 18px;
      animation: tt-lift 1.4s ease-in-out infinite;
      transform-origin: center bottom;
    }
    @keyframes tt-lift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      40%, 70% { transform: translateY(-22px) rotate(-8deg); }
    }

    /* 9. Aroma */
    .tt-aroma-loader { position: relative; width: 60px; height: 60px; }
    .tt-aroma-loader span {
      position: absolute; bottom: 10px; left: 50%;
      width: 8px; height: 20px;
      background: var(--primary);
      border-radius: 50px; opacity: 0.6;
      transform-origin: center bottom;
      animation: aroma-rise 2s ease-in-out infinite;
    }
    .tt-aroma-loader span:nth-child(1) { transform: translateX(-18px); animation-delay: 0s; }
    .tt-aroma-loader span:nth-child(2) { transform: translateX(-4px); animation-delay: 0.3s; }
    .tt-aroma-loader span:nth-child(3) { transform: translateX(10px); animation-delay: 0.6s; }
    @keyframes aroma-rise {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.4; }
      40% { transform: translateY(-25px) scale(1.2) rotate(8deg); opacity: 1; }
      70% { transform: translateY(-40px) scale(0.9) rotate(-6deg); opacity: 0.7; }
    }

    /* 10. Fusion */
    .tt-fusion-loader { position: relative; width: 80px; height: 40px; }
    .tt-fusion-loader div {
      position: absolute; top: 0; width: 40px; height: 40px;
      border-radius: 50%; filter: blur(1px); opacity: 0.8;
    }
    .left { left: 0; background: var(--primary); animation: left-move 1.6s ease-in-out infinite; }
    .right { right: 0; background: var(--primary-light); animation: right-move 1.6s ease-in-out infinite; }
    .center { left: 20px; background: var(--primary); transform: scale(0); animation: center-bloom 1.6s ease-in-out infinite; }
    @keyframes left-move { 0%,100% { transform: translateX(0); } 50% { transform: translateX(20px); } }
    @keyframes right-move { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-20px); } }
    @keyframes center-bloom {
      0%,100% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* 11. Stroke */
    .tt-stroke-loader { width: 140px; height: 70px; }
    .tt-stroke-loader svg { width: 100%; height: 100%; }
    #stroke {
      fill: none; stroke: var(--primary); stroke-width: 8;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 200; stroke-dashoffset: 200;
      animation: draw 1.8s ease-in-out infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 200; opacity: 0.4; }
      40%,70% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -200; opacity: 0.4; }
    }

    /* 12. Drip */
    .tt-drip-loader { width: 40px; height: 60px; position: relative; }
    .drip {
      width: 14px; height: 14px; background: var(--primary);
      border-radius: 50%; position: absolute; left: 50%;
      transform: translateX(-50%);
      animation: drip 1.4s ease-in-out infinite;
    }
    @keyframes drip {
      0% { top: 0; height: 14px; border-radius: 50%; }
      40% { top: 30px; height: 26px; border-radius: 14px; }
      60% { top: 40px; height: 14px; border-radius: 50%; }
      100% { top: 0; }
    }

    /* 13. Sizzle */
    .tt-sizzle-loader { position: relative; width: 60px; height: 40px; }
    .tt-sizzle-loader span {
      position: absolute; bottom: 0; width: 6px; height: 6px;
      background: var(--primary); border-radius: 50%;
      animation: sizzle 0.9s infinite ease-out; opacity: 0;
    }
    .tt-sizzle-loader span:nth-child(1) { left: 5px; animation-delay: 0s; }
    .tt-sizzle-loader span:nth-child(2) { left: 20px; animation-delay: 0.15s; }
    .tt-sizzle-loader span:nth-child(3) { left: 35px; animation-delay: 0.3s; }
    .tt-sizzle-loader span:nth-child(4) { left: 50px; animation-delay: 0.45s; }
    @keyframes sizzle {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-25px) scale(1); opacity: 0; }
    }

    /* 14. Noodle */
    .tt-noodle-loader { width: 140px; height: 70px; }
    #noodle {
      fill: none; stroke: var(--primary); stroke-width: 6;
      stroke-linecap: round; stroke-dasharray: 180; stroke-dashoffset: 180;
      animation: noodle 1.6s ease-in-out infinite;
    }
    @keyframes noodle {
      0% { stroke-dashoffset: 180; opacity: 0.4; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -180; opacity: 0.4; }
    }
  </style>
</head>

  50% { transform: scale(1.3); opacity: 1; }
}`
      },
      {
        id: "stroke",
        name: "Signature Stroke",
        html: `<div class="tt-stroke-loader">
  <svg viewBox="0 0 120 60">
    <path id="stroke" d="M10 40 C 40 10, 80 10, 110 40" />
  </svg>
</div>`,
        css: `.tt-stroke-loader { width: 140px; height: 70px; }
.tt-stroke-loader svg { width: 100%; height: 100%; }
#stroke {
  fill: none; stroke: #007fc3; stroke-width: 8;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 200; stroke-dashoffset: 200;
  animation: draw 1.8s ease-in-out infinite;
}
@keyframes draw {
  0% { stroke-dashoffset: 200; opacity: 0.4; }
  40%,70% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: -200; opacity: 0.4; }
}`
      },
      {
        id: "drip",
        name: "Drip",
        html: `<div class="tt-drip-loader"><div class="drip"></div></div>`,
        css: `.tt-drip-loader { width: 40px; height: 60px; position: relative; }
.drip {
  width: 14px; height: 14px; background: #007fc3;
  border-radius: 50%; position: absolute; left: 50%;
  transform: translateX(-50%);
  animation: drip 1.4s ease-in-out infinite;
}
@keyframes drip {
  0% { top: 0; height: 14px; border-radius: 50%; }
  40% { top: 30px; height: 26px; border-radius: 14px; }
  60% { top: 40px; height: 14px; border-radius: 50%; }

      },
      {
        id: "sizzle",
        name: "Sizzle",
        html: `<div class="tt-sizzle-loader">
  <span></span><span></span><span></span><span></span>
</div>`,
        css: `.tt-sizzle-loader { position: relative; width: 60px; height: 40px; }
.tt-sizzle-loader span {
  position: absolute; bottom: 0; width: 6px; height: 6px;
  background: #007fc3; border-radius: 50%;
  animation: sizzle 0.9s infinite ease-out; opacity: 0;
}

.tt-sizzle-loader span:nth-child(2) { left: 20px; animation-delay: 0.15s; }
.tt-sizzle-loader span:nth-child(3) { left: 35px; animation-delay: 0.3s; }

      },

  </svg>

        css: `.tt-noodle-loader { width: 140px; height: 70px; }

  fill: none; stroke: #007fc3; stroke-width: 6;
  stroke-linecap: round; stroke-dasharray: 180; stroke-dashoffset: 180;
  animation: noodle 1.6s ease-in-out infinite;
}
@keyframes noodle {

      }
    ];

    // ============ RENDER GALLERY ============
    const gallery = document.getElementById("gallery");
    const toast = document.getElementById("toast");

    loaders.forEach(loader => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="preview">${loader.html}</div>
        <div class="label">${loader.name}</div>
        <div class="actions">
          <button class="btn btn-secondary" data-copy="html" data-id="${loader.id}">Copy HTML</button>
          <button class="btn btn-primary" data-copy="css" data-id="${loader.id}">Copy CSS</button>
        </div>
      `;
      gallery.appendChild(card);
    });

    // ============ COPY LOGIC ============
    function showToast(msg = "Copied!") {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;

      const type = btn.dataset.copy;
      const id = btn.dataset.id;
      const loader = loaders.find(l => l.id === id);
      if (!loader) return;

      const text = type === "html" ? loader.html : loader.css;

      navigator.clipboard.writeText(text).then(() => {
        showToast(`${type.toUpperCase()} copied!`);
      }).catch(() => {
        // fallback
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast(`${type.toUpperCase()} copied!`);
      });
    });
  </script>
</body>
</html>

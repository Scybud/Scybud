<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style form | Scybud</title>

    <!-- Scybud UI Core -->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/animations.css"
    />

    <!-- Scybud UI Components -->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/global-buttons.css"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--space-lg);
        box-sizing: border-box;
      }

      .top-bar {
        width: 100%;
        max-width: 420px;
        margin-bottom: var(--space-lg);
      }

      /* Typing heading */
      h1 {
        font-family: var(--font-mono);
        font-size: var(--text-2xl);
        font-weight: var(--font-bold);
        text-align: center;
        margin: 0 0 var(--space-xl);
        overflow: hidden;
        white-space: nowrap;
        max-width: 100%;
        animation: typing 2.8s steps(28) forwards;
      }

      h1::after {
        content: "|";
        animation: blink 0.6s infinite;
        color: var(--primary);
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }

      main {
        width: 100%;
        max-width: 420px;
        background: var(--surface-primary);
        border: 1px solid var(--border-primary);
        border-radius: var(--radius-md);
        padding: var(--space-xl) var(--space-lg);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #loginMessage {
        margin: 0 0 var(--space-sm);
        font-size: var(--text-sm);
        font-weight: var(--font-medium);
        min-height: 20px;
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }

      fieldset {
        border: none;
        border-bottom: 2px solid var(--border-primary);
        margin: 0;
        padding: 0 0 var(--space-xs);
        transition: border-color var(--transition-normal);
      }

      fieldset:focus-within {
        border-bottom-color: var(--primary);
      }

      legend {
        font-size: var(--text-sm);
        font-weight: var(--font-semibold);
        color: var(--primary);
        padding: 0;
        margin-bottom: 4px;
      }

      .all-inputs {
        width: 100%;
        height: 44px;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: var(--text-md);
        font-family: var(--font-primary);
        outline: none;
        padding: 0;
      }

      .all-inputs::placeholder {
        color: var(--muted);
      }

      .btn-login {
        width: 100%;
        height: 50px;
        font-size: var(--text-md);
        margin-top: var(--space-sm);
      }

      /* Image at the bottom */
      .form-image {
        margin-top: var(--space-xl);
        max-width: 300px;
        width: 100%;
        border-radius: var(--radius-md);
        transition: all 0.6s ease;
        border: 1px solid var(--border-primary);
      }

      .form-image:hover {
        max-width: 100%;
        box-shadow: 0 0 20px rgba(0, 127, 195, 0.4);
      }

      footer {
        margin-top: auto;
        padding: var(--space-lg) 0;
        text-align: center;
        color: var(--muted);
        font-size: var(--text-sm);
        width: 100%;
        max-width: 420px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="index.html" class="btn btn-primary">← Home</a>
    </div>

    <h1>This is a login form.</h1>

    <main>
      <h5 id="loginMessage"></h5>

      <form>
        <fieldset>
          <legend>Name</legend>
          <input
            id="name"
            type="text"
            name="name"
            class="all-inputs"
            placeholder="Enter your name"
          />
        </fieldset>

        <fieldset>
          <legend>Email</legend>
          <input
            id="email"
            type="email"
            name="email"
            class="all-inputs"
            placeholder="Enter your email"
            autocomplete="off"
          />
        </fieldset>

        <fieldset>
          <legend>Password (scybudtech)</legend>
          <input
            id="password"
            type="password"
            name="Password"
            class="all-inputs"
            placeholder="Enter your password"
          />
        </fieldset>

        <button
          onclick="login(event)"
          type="button"
          class="btn btn-primary btn-login"
        >
          Login
        </button>
      </form>
    </main>

    <img src="styeformimg.png" alt="Form illustration" class="form-image" />

    <footer>
      <p>&copy; scybud | All rights reserved</p>
    </footer>

    <script>
      function login(event) {
        event.preventDefault();

        const loginMessage = document.getElementById("loginMessage");
        const username = document.getElementById("name").value.trim();
        const useremail = document.getElementById("email").value.trim();
        const userpassword = document.getElementById("password").value;
        const password = "scybudtech";
        const redirectURL = "projects.html";

        if (!username || !useremail || !userpassword) {
          loginMessage.style.color = "var(--danger)";
          loginMessage.innerText = "All fields must be filled";
        } else if (password === userpassword) {
          loginMessage.style.color = "var(--success)";
          loginMessage.innerText = `Hi, ${username} with the email: ${useremail}`;
          document.querySelector("main").style.boxShadow =
            "0 0 24px rgba(16, 185, 129, 0.4)";

          setTimeout(() => {
            document.querySelector("main").style.boxShadow = "var(--shadow)";
            window.location.href = redirectURL;
          }, 3000);
        } else {
          loginMessage.style.color = "var(--danger)";
          loginMessage.innerText = "Incorrect! The password is scybudtech";
        }
      }
    </script>
  </body>
</html>

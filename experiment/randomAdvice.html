<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background: #000;
            color: #fff;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        main {
            background: #2f2e2e;
            max-width: 600px;
            width: 400px;
            min-height: 100px;
            padding: 12px;
            border-radius: 8px;
                     display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #advice {
            display: inline;
            padding: 0 6px;
            margin: 12px 6px;
            border: none;
            border-radius: 6px;
            min-width: 100%;
            background: #1d1d1d;
            color: #fff;
            text-wrap: wrap;
        }
.placeholder {
    color: #9c9c9c;
}
        button {
            background: #27a1ff;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #27a1ffc8;
        }
        button:active {
            transform: scale(0.9);
        }
        
        .loader {
            width: 40px;
            height: 40px;
            border-left: 4px solid #27a1ff;
            border-radius: 50%;
            margin: 6px auto;
            animation: rotate 0.5s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0);
            } to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Quotes For You!</h1>
    
    <main>
        <div id="advice" disabled>
            <p class="placeholder">
                Quotes appear here..
            </p>
        </div>
        <button type="button" id="getAdvice">Get Quote</button>
    </main>

<script>
const adviceEl = document.getElementById("advice");
const getAdviceBtn = document.getElementById("getAdvice");

if(getAdviceBtn) {
    getAdviceBtn.addEventListener("click", () => {
        adviceEl.innerHTML = `        <div class="loader"></div>`

        fetch("https://api.adviceslip.com/advice")
        .then(response => {
            return response.json()
        })
        .then(data => {
            if(adviceEl) {

                adviceEl.innerHTML = `<p>${data.slip.advice}</p>`;
            }
    })
        .catch(error => console.error(error));
    })
}
</script>

</body>
</html>

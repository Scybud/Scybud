<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes For You | Scybud</title>

  <!-- Scybud UI Core -->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css" />

  <!-- Scybud UI Components -->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/global-buttons.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-lg);
      box-sizing: border-box;
    }

    .top-bar {
      width: 100%;
      max-width: 480px;
      margin-bottom: var(--space-lg);
    }

    h1 {
      margin: 0 0 var(--space-xl);
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
      text-align: center;
      color: var(--text-primary);
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      padding: var(--space-xl) var(--space-lg);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
    }

    #advice {
      width: 100%;
      min-height: 120px;
      padding: var(--space-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: var(--text-md);
      line-height: 1.6;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #advice .placeholder {
      color: var(--muted);
      margin: 0;
    }

    #advice p {
      margin: 0;
    }

    .btn-get {
      width: 100%;
      max-width: 220px;
      height: 48px;
      font-size: var(--text-md);
    }

    /* Loader using Scybud primary color */
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-secondary);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: rotate 0.7s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    footer {
      margin-top: auto;
      padding: var(--space-lg) 0;
      text-align: center;
      color: var(--muted);
      font-size: var(--text-sm);
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="btn btn-primary">← Home</a>
  </div>

  <h1>Quotes For You!</h1>

  <main>
    <div id="advice">
      <p class="placeholder">Quotes appear here..</p>
    </div>

    <button type="button" id="getAdvice" class="btn btn-primary btn-get">
      Get Quote
    </button>
  </main>

  <footer>
    <p>&copy; scybud | All rights reserved</p>
  </footer>

  <script>
    const adviceEl = document.getElementById("advice");
    const getAdviceBtn = document.getElementById("getAdvice");

    if (getAdviceBtn) {
      getAdviceBtn.addEventListener("click", () => {


        fetch("https://api.adviceslip.com/advice")
          .then(response => response.json())
          .then(data => {
            if (adviceEl) {
              adviceEl.innerHTML = `<p>${data.slip.advice}</p>`;
            }
          })
          .catch(error => {
            console.error(error);
            adviceEl.innerHTML = `<p class="placeholder">Failed to load quote. Try again.</p>`;
          });
      });
    }
  </script>
</body>
</html>

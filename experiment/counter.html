<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter | Scybud</title>

  <!-- Scybud UI Core -->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css" />

  <!-- Scybud UI Components -->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/global-buttons.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-lg);
      box-sizing: border-box;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      margin-bottom: var(--space-lg);
      display: flex;
      justify-content: flex-start;
    }

    main {
      width: 100%;
      max-width: 420px;
      background-color: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      padding: var(--space-xl) var(--space-lg);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
    }

    h1 {
      margin: 0;
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      text-align: center;
    }

    #addtaskContainer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
    }

    label {
      font-size: var(--text-md);
      color: var(--text-secondary);
    }

    #numberCount {
      margin: 0;
      font-size: 4rem;
      font-family: var(--font-mono);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      line-height: 1;
    }

    #counterBtn {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-sm);
    }

    #counterBtn .btn {
      min-width: 80px;
      height: 56px;
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtract uses danger tone */
    #subtractbtn {
      background: var(--danger);
      color: #fff;
    }
    #subtractbtn:hover {
      filter: brightness(1.15);
    }

    /* Add uses success tone */
    #addbtn {
      background: var(--success);
      color: #fff;
    }
    #addbtn:hover {
      filter: brightness(1.15);
    }

    footer {
      margin-top: auto;
      padding: var(--space-lg) 0;
      text-align: center;
      color: var(--muted);
      font-size: var(--text-sm);
      border-top: 1px solid var(--border-primary);
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="btn btn-primary">← Home</a>
  </div>

  <main>
    <h1>My Counter</h1>

    <div id="addtaskContainer">
      <label for="numberCount">Click to count</label>
      <h2 id="numberCount">0</h2>

      <div id="counterBtn">
        <button type="button" id="subtractbtn" class="btn" onclick="subtract()">−</button>
        <button type="button" id="addbtn" class="btn" onclick="add()">+</button>
      </div>
    </div>

    <div id="addedTasks"></div>
  </main>

  <footer>
    <p>&copy; scybud | All rights reserved</p>
  </footer>

  <script>
    let count = document.getElementById("numberCount");
    let Num = 0;

    function add() {
      count.textContent = ++Num;
    }

    function subtract() {
      count.textContent = --Num;
    }
  </script>
</body>
</html>
